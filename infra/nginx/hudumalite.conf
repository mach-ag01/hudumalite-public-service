# Example reverse proxy/load balancer for deployments with two or more Django API instances.
# Replace the upstream addresses with private network addresses of your actual app instances.
# Do not expose Gunicorn instances directly to the public internet.

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn_per_ip:10m;

upstream hudumalite_api {
    least_conn;
    server 10.0.1.11:8000 max_fails=3 fail_timeout=30s;
    server 10.0.1.12:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.example.gov;

    # Configure TLS certificates through your host/ACME tooling.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn api_conn_per_ip 20;

        proxy_pass http://hudumalite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
